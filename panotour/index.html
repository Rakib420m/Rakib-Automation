<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Streaming - Official HD Player</title>
    <script>
        // URL থেকে id বা slug রিড করে ডাইনামিক টাইটেল বা রিডাইরেক্ট হ্যান্ডেল করার জন্য
        window.addEventListener('DOMContentLoaded', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('id');
            if (videoId) {
                // যদি প্রয়োজন হয় এখানে ভিডিও আইডি প্রসেস করতে পারেন
                console.log("Loaded Stream ID:", videoId);
            }
        });
    </script>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 100px; }
        .player-box { max-width: 700px; margin: auto; background: #111; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        h2 { color: #ff3b30; }
    </style>
</head>
<body>
    <div class="player-box">
        <h2>Live Stream Secure Player</h2>
        <p>Connecting to broadcast server...</p>
        <div style="margin: 20px 0;">
            <img src="https://i.imgur.com/3Z664wB.png" alt="Loading..." style="width: 80px; animation: pulse 1.5s infinite;">
        </div>
        <p style="font-size: 12px; color: #888;">Optimized for Chrome & Mobile Browsers</p>
    </div>
</body>
</html>
